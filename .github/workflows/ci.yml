name: CI

on:
  push:
    branches: [main]
    paths-ignore: &documentation-only
      - 'docs/design-notes/**'
      - 'docs/roadmap/**'
      - 'docs/superpowers/**'
      - 'docs/operations/**'
      - 'AGENTS.md'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore: *documentation-only

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check plotcheck targets
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --all-targets --features plotcheck

      - name: Check scalar targets
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --all-targets --no-default-features

      - name: Tests
        run: cargo test

      - name: Set up Python
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version-file: scripts/.python-version
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Python tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Runtime allocation profile tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test --features profile-alloc --lib
          cargo test --features profile-alloc --test runtime_profile_binary

      - name: Release recovery tests
        if: matrix.os == 'ubuntu-latest'
        env:
          CARGO_PROFILE_RELEASE_LTO: 'false'
        run: 'cargo test --release --lib -- life:: scripting::'

      - name: Install mdbook
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      - name: Build books
        if: matrix.os == 'ubuntu-latest'
        run: |
          mdbook build docs/rhai_book
          mdbook build docs/rhai_book_ja
