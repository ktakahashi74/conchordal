[package]
name = "conchordal"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
publish = false
default-run = "conchordal"
license = "MIT OR Apache-2.0"
description = "A psychoacoustic instrument for generative composition"
repository = "https://github.com/ktakahashi74/conchordal"
keywords = ["audio", "alife", "music", "art", "synthesizer"]
categories = ["multimedia::audio"]

[[bin]]
name = "conchordal"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "conchordal-render"
path = "src/bin/render.rs"
required-features = ["native"]

[[bin]]
name = "gen_rhai_defs"
path = "src/bin/gen_rhai_defs.rs"
required-features = ["native"]

[profile.dev]
opt-level = 1
debug = true
overflow-checks = true
incremental = true

[profile.release]
opt-level = 3
lto = true
#debug = true

# DSP code intentionally uses mutation-style struct construction and indexed
# loops for clarity around parallel arrays and incremental builders. These
# style lints fire across the kernel and engine layers; silencing them keeps
# `cargo clippy -- -D warnings` actionable for real issues.
[lints.clippy]
field_reassign_with_default = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[dependencies]
conchordal-web-ui = { path = "gui", default-features = false }
anyhow = "1.0"

clap = { version = "4.6", features = ["derive"], optional = true }
ctrlc = { version = "3.5", optional = true }

# GUI
egui = { version = "0.37", optional = true }
egui_plot = { version = "0.38", optional = true }

# Concurrency
crossbeam-channel = { version = "0.5", optional = true }

# DSP / Math
fearless_simd = "1.1.0"
rustfft = "6"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
plotters = { version = "0.3", optional = true, default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "ttf"] }

# Config (TOML)
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
toml = "1.1"


# Logging / tracing (optional)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"], optional = true }

# Audio I/O
cpal = { version = "0.18", optional = true }
hound = { version = "3.5", optional = true }

ringbuf = { version = "0.5", optional = true }
rhai = { version = "1.27", default-features = false, features = ["std", "metadata", "compact_str"] }
web-time = { version = "1.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pipewire"], optional = true }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rustfft = { version = "6", features = ["wasm_simd"] }

[features]
default = ["native"]
native = ["dep:ringbuf", "dep:clap", "dep:ctrlc", "dep:egui", "dep:egui_plot", "dep:eframe", "dep:cpal", "dep:hound", "dep:crossbeam-channel", "dep:tracing-subscriber", "rand/thread_rng", "rhai/default"]
web = ["dep:web-time", "rhai/no_time"]
profile-alloc = []
# Temporary proposal replay for the isolated T-31 prototype.
loo-diagnostic = []
plotcheck = ["dep:plotters"]

[dev-dependencies]
libm = "0.2"
serde = { version = "1.0", features = ["rc"] }
approx = "0.5"
walkdir = "2.5"
